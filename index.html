<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inicio</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <div class="layout">
      <header id="menu_principal" class="site-header">
        <div class="header-container">
          <div class="brand-logos" aria-label="Logotipos institucionales">
            <img
              src="img/logo-gob-mx.png"
              class="logo-gob"
              alt="Gobierno de Mexico"
            />
          </div>
        </div>
      </header>

      <main class="bloque-global">
        <section class="contenido-home" aria-label="Presentación y mapa">
          <div class="panel-presentacion">
            <!--  -->
            <iframe
              class="presentacion"
              src="https://docs.google.com/presentation/d/173EMuFaJw0GLccKHRVDeNngsujYQb904/embed?start=false&amp;loop=false&amp;delayms=3000"
              title="Presentación de jornaleros"
              allowfullscreen
            ></iframe>
            <a
              class="enlace-presentacion"
              href="https://docs.google.com/presentation/d/173EMuFaJw0GLccKHRVDeNngsujYQb904/edit?usp=sharing&amp;ouid=107973810081867059729&amp;rtpof=true&amp;sd=true"
              target="_blank"
              rel="noopener noreferrer"
            >
              Abrir presentación en otra pestaña
            </a>
          </div>

          <div class="panel-mapa">
            <iframe
              class="mapa-jornaleros"
              src="mapa_jornaleros_bc.html"
              title="Mapa de jornaleros Baja California"
            ></iframe>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <div class="gob-footer-banner"></div>
      </footer>
    </div>
  </body>
</html>
