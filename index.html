<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inicio</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <div class="layout">
      <header id="menu_principal" class="site-header">
        <div class="header-container">
          <!-- Control accesible del menú lateral. -->
          <button
            id="menu-toggle"
            class="menu-toggle"
            type="button"
            aria-label="Abrir menú"
            aria-expanded="false"
            aria-controls="menu-lateral"
          >
            <span class="menu-toggle__line" aria-hidden="true"></span>
            <span class="menu-toggle__line" aria-hidden="true"></span>
            <span class="menu-toggle__line" aria-hidden="true"></span>
          </button>

          <div class="brand-logos" aria-label="Logotipos institucionales">
            <img
              src="img/logo-gob-mx_ok.png"
              class="logo-gob"
              alt="Gobierno de Mexico"
            />
          </div>
        </div>

        <!-- El backdrop y el panel permanecen ocultos hasta abrir el menú. -->
        <div
          id="menu-lateral-backdrop"
          class="menu-lateral-backdrop offcanvas-backdrop"
          aria-hidden="true"
          hidden
        ></div>

        <aside
          id="menu-lateral"
          class="menu-lateral offcanvas"
          role="dialog"
          aria-modal="true"
          aria-label="Menú principal"
          aria-hidden="true"
          tabindex="-1"
        >
          <!-- Navegación semántica inspirada en el menú institucional de referencia. -->
          <nav class="menu-lateral__nav" aria-label="Navegación principal">
            <ul class="menu-lateral__items menu-items">
              <li>
                <a
                  class="menu-lateral__item menu-item"
                  href="index.html"
                  aria-current="page"
                >
                  <span class="menu-lateral__item-content menu-item__content">
                    <svg
                      class="menu-lateral__icon menu-icon"
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                      focusable="false"
                    >
                      <path d="m3 11 9-8 9 8" />
                      <path d="M5 10v10h14V10" />
                      <path d="M9 20v-6h6v6" />
                    </svg>
                    <span>Inicio</span>
                  </span>
                </a>
              </li>
              <li>
                <a
                  class="menu-lateral__item menu-item"
                  href="captura-seguimiento.html"
                >
                  <span class="menu-lateral__item-content menu-item__content">
                    <svg
                      class="menu-lateral__icon menu-icon"
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                      focusable="false"
                    >
                      <path d="M9 5h6m-5-2h4a1 1 0 0 1 1 1v2H9V4a1 1 0 0 1 1-1Z" />
                      <path d="M8 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" />
                      <path d="M8 11h8M8 15h8M8 19h5" />
                    </svg>
                    <span>Seguimiento de acciones</span>
                  </span>
                </a>
              </li>
              <li>
                <button
                  id="cerrar-sesion"
                  class="menu-lateral__item menu-item"
                  type="button"
                >
                  <span class="menu-lateral__item-content menu-item__content">
                    <svg
                      class="menu-lateral__icon menu-icon"
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                      focusable="false"
                    >
                      <path d="M10 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h5" />
                      <path d="M14 8l4 4-4 4M18 12H8" />
                    </svg>
                    <span>Cerrar Sesión</span>
                  </span>
                </button>
              </li>
            </ul>
          </nav>
        </aside>
      </header>

      <main class="bloque-global">
        <section class="contenido-home" aria-label="Presentación y mapa">
          <div class="panel-presentacion">
            <!-- OPCIÓN 1: PDF LOCAL (activa) -->
            <!-- <iframe
              class="presentacion"
              src="mapa.pdf"
              title="Presentación en PDF"
              allowfullscreen
            ></iframe> -->

            <!-- OPCIÓN 2: POWERPOINT EN GOOGLE SLIDES (inactiva) -->

            <iframe
              class="presentacion"
              src="https://docs.google.com/presentation/d/1U_rgs37cV8lI4UcQqXBTLNe4a0w0f4oR/embed?start=false&loop=false&delayms=3000"
              title="Presentación de jornaleros"
              allowfullscreen
            ></iframe>
          </div>

          <div class="panel-mapa">
            <iframe
              class="mapa-jornaleros"
              src="mapa_jornaleros_bc.html"
              title="Mapa de jornaleros Baja California"
            ></iframe>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <div class="gob-footer-banner"></div>
      </footer>
    </div>
    <script src="js/menu-lateral.js"></script>
  </body>
</html>
